{% extends "base.html" %}
{% block content %}
<h2>{{ title }}</h2>
<form method="post" class="emp-form">
  <label>Full Name</label>
  <input type="text" name="full_name" required value="{{ employee.FullName if employee else '' }}">

  <label>Email</label>
  <input type="email" name="email" required value="{{ employee.Email if employee else '' }}">

  <label>Department</label>
  <select name="department">
    {% for d in ['IT', 'HR', 'Finance', 'Sales', 'Operations'] %}
      <option value="{{ d }}" {% if employee and employee.Department == d %}selected{% endif %}>{{ d }}</option>
    {% endfor %}
  </select>

  <label>Status</label>
  <select name="status">
    {% for s in ['On Boarding', 'Active', 'Inactive'] %}
      <option value="{{ s }}" {% if employee and employee.Status == s %}selected{% endif %}>{{ s }}</option>
    {% endfor %}
  </select>

  <button type="submit" class="btn">Save</button>
  <a href="{{ url_for('index') }}">Cancel</a>
</form>
{% endblock %}
