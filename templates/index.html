{% extends "base.html" %}
{% block content %}
<div class="toolbar">
  <form method="get" action="{{ url_for('index') }}">
    <input type="text" name="search" placeholder="Search by name or department" value="{{ search }}">
    <button type="submit">Search</button>
  </form>
  <a class="btn" href="{{ url_for('add_employee') }}">+ Add Employee</a>
</div>

<table>
  <thead>
    <tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Status</th><th>Actions</th></tr>
  </thead>
  <tbody>
    {% for e in employees %}
    <tr>
      <td>{{ e.EmployeeID }}</td>
      <td>{{ e.FullName }}</td>
      <td>{{ e.Email }}</td>
      <td>{{ e.Department }}</td>
      <td>{{ e.Status }}</td>
      <td>
        <a href="{{ url_for('edit_employee', employee_id=e.EmployeeID) }}">Edit</a>
        <form method="post" action="{{ url_for('delete_employee', employee_id=e.EmployeeID) }}"
              class="inline" onsubmit="return confirm('Delete this employee?');">
          <button type="submit" class="danger">Delete</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="6">No employees found.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
